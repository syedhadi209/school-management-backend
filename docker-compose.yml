# Local multi-service stack for validating the production Docker image.
# Railway itself uses the Dockerfile + railway.toml (not this compose file).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: local-docker-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://postgres:postgres@db:5432/school_management
      DB_SSL_REQUIRE: "false"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SECURE_SSL_REDIRECT: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
